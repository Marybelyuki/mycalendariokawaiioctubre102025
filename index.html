<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦄 Merakelysi Planner 💖</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=M+PLUS+Rounded+1c:wght@400;700;800&family=Questrial&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22 viewBox=%220 0 24%22><text y=%2220%22 font-size=%2220%22>🦄</text></svg>"), auto;
        }
        .font-luckiest-guy { font-family: 'Luckiest Guy', cursive; }
        .font-questrial { font-family: 'Questrial', sans-serif; }
        @keyframes bounce { 0%, 100% { transform: translateY(-15%); } 50% { transform: translateY(0); } }
        @keyframes pulse { 50% { opacity: .6; } }
        .animate-bounce { animation: bounce 1.8s infinite cubic-bezier(0.4, 0, 0.6, 1); }
        .animate-pulse { animation: pulse 2.2s infinite cubic-bezier(0.4, 0, 0.6, 1); }
        .hidden { display: none !important; } 
        #schedule-timeline { 
            position: relative; 
            height: calc(24 * 4rem); /* 24 hours * h-16 (4rem) */
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-pink-100 via-purple-100 to-cyan-100 p-4">

    <div class="fixed top-10 left-10 text-5xl animate-bounce z-0">🦄</div>
    <div class="fixed top-20 right-20 text-4xl animate-pulse z-0">⭐</div>
    <div class="fixed bottom-20 left-20 text-4xl animate-bounce z-0">🌈</div>
    
    <div class="max-w-7xl mx-auto relative z-10">
        <header class="bg-white/80 backdrop-blur-sm rounded-3xl shadow-lg p-6 mb-6 border-4 border-pink-200 relative">
            <div class="flex flex-col xl:flex-row items-center justify-between gap-4">
                <div>
                    <h1 class="font-luckiest-guy text-5xl lg:text-6xl bg-gradient-to-r from-purple-500 to-indigo-600 bg-clip-text text-transparent mb-2 tracking-wider">Merakelysi Planner</h1>
                    <p class="text-purple-600 text-sm md:text-base font-questrial mb-2">Elaborado por: Maribel Alba Olmedo</p>
                    <div class="flex items-center gap-3">
                        <button id="prev-btn" class="bg-pink-200 text-pink-600 p-2 rounded-full hover:bg-pink-300 transition"><i data-lucide="chevron-left"></i></button>
                        <p id="current-date-display" class="text-purple-600 font-bold text-lg text-center w-80">Cargando...</p>
                        <button id="next-btn" class="bg-pink-200 text-pink-600 p-2 rounded-full hover:bg-pink-300 transition"><i data-lucide="chevron-right"></i></button>
                    </div>
                </div>
                <div class="flex flex-col sm:flex-row gap-3 items-center">
                    <div class="flex gap-2 bg-pink-100/50 p-2 rounded-2xl border-2 border-pink-200">
                        <button data-view="daily" class="view-btn px-3 py-2 rounded-xl font-bold transition transform hover:scale-105">📅 Diario</button>
                        <button data-view="weekly" class="view-btn px-3 py-2 rounded-xl font-bold transition transform hover:scale-105">📆 Semanal</button>
                        <button data-view="monthly" class="view-btn px-3 py-2 rounded-xl font-bold transition transform hover:scale-105">🗓️ Mensual</button>
                        <button data-view="yearly" class="view-btn px-3 py-2 rounded-xl font-bold transition transform hover:scale-105">🎊 Anual</button>
                    </div>
                    <button id="export-txt-btn" class="bg-gradient-to-r from-cyan-400 to-blue-400 text-white px-4 py-3 rounded-full font-bold flex items-center gap-2 shadow-lg transform hover:scale-105 transition" title="Descargar Resumen en .txt"><i data-lucide="file-text"></i></button>
                    <button id="export-ics-btn" class="bg-gradient-to-r from-purple-400 to-pink-400 text-white px-4 py-3 rounded-full font-bold flex items-center gap-2 shadow-lg transform hover:scale-105 transition" title="Exportar Eventos a Calendario (.ics)"><i data-lucide="calendar-plus"></i></button>
                </div>
            </div>
        </header>

        <main>
            <div id="daily-view" class="view-container grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="space-y-6">
                    <div class="bg-white/80 backdrop-blur-sm rounded-3xl shadow-lg p-6 border-4 border-cyan-200"><h2 class="font-questrial text-2xl font-bold text-teal-500 mb-4 flex items-center gap-2"><i data-lucide="target"></i>Objetivos del Día</h2><textarea id="goals-textarea" class="w-full h-24 p-3 rounded-2xl border-2 border-cyan-200 bg-cyan-50/50 focus:outline-cyan-400" placeholder="¿Qué quieres lograr hoy? ✨"></textarea></div>
                    <div class="bg-white/80 backdrop-blur-sm rounded-3xl shadow-lg p-6 border-4 border-pink-200"><h2 class="font-questrial text-2xl font-bold text-pink-500 mb-4 flex items-center gap-2"><i data-lucide="check-square"></i>To-Do List</h2><div class="space-y-3 mb-4"><input type="text" id="task-input" class="w-full p-3 rounded-2xl border-2 border-pink-200 focus:outline-pink-400" placeholder="Nueva tarea... 💕"><div class="flex gap-2"><select id="priority-select" class="flex-1 p-2 rounded-xl border-2 border-pink-200"><option value="high">⭐ Alta</option><option value="medium">💖 Media</option><option value="normal" selected>☁️ Normal</option></select><button id="add-task-btn" class="bg-gradient-to-r from-pink-400 to-pink-500 text-white px-4 py-2 rounded-xl font-bold shadow-lg transform hover:scale-105 transition"><i data-lucide="plus"></i></button></div></div><div id="tasks-container" class="space-y-2 max-h-96 overflow-y-auto"></div></div>
                </div>
                <div class="bg-white/80 backdrop-blur-sm rounded-3xl shadow-lg p-6 border-4 border-purple-200">
                    <h2 class="font-questrial text-2xl font-bold text-purple-500 mb-4 flex items-center gap-2"><i data-lucide="calendar"></i>Horario</h2>
                    <div class="space-y-3 mb-4">
                        <div class="grid grid-cols-2 gap-2 text-sm text-center text-purple-600"><div>Hora de Inicio</div><div>Hora de Fin</div></div>
                        <div class="grid grid-cols-[1fr,auto,1fr,auto,1fr,auto,1fr] items-center gap-1">
                            <select id="event-start-hour" class="w-full p-2 rounded-xl border-2 border-purple-200"></select><span class="font-bold text-purple-400">:</span><select id="event-start-minute" class="w-full p-2 rounded-xl border-2 border-purple-200"></select>
                            <span class="font-bold text-gray-400 mx-1">-</span>
                            <select id="event-end-hour" class="w-full p-2 rounded-xl border-2 border-purple-200"></select><span class="font-bold text-purple-400">:</span><select id="event-end-minute" class="w-full p-2 rounded-xl border-2 border-purple-200"></select>
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="event-text-input" class="flex-1 p-2 rounded-xl border-2 border-purple-200" placeholder="Evento... 🎉">
                            <button id="add-event-btn" class="bg-gradient-to-r from-purple-400 to-pink-400 text-white px-4 py-2 rounded-xl shadow-lg transform hover:scale-105 transition"><i data-lucide="plus"></i></button>
                        </div>
                    </div>
                    <div class="max-h-[600px] overflow-y-auto bg-white/50 rounded-lg p-2"> 
                        <div id="schedule-timeline" class="relative"> 
                            </div>
                    </div>
                </div>
                <div class="bg-white/80 backdrop-blur-sm rounded-3xl shadow-lg p-6 border-4 border-cyan-200"><h2 class="font-questrial text-2xl font-bold text-teal-500 mb-4 flex items-center gap-2"><i data-lucide="notebook-pen"></i>Notas</h2><textarea id="notes-textarea" class="w-full h-full min-h-[500px] p-4 rounded-2xl border-2 border-cyan-200 bg-cyan-50/50 focus:outline-cyan-400" placeholder="Escribe tus pensamientos aquí... 🌟"></textarea></div>
            </div>
            <div id="weekly-view" class="view-container hidden"><div class="bg-white/80 backdrop-blur-sm rounded-3xl shadow-lg p-6 border-4 border-pink-200"><div id="weekly-grid" class="grid grid-cols-[auto_1fr_1fr_1fr_1fr_1fr_1fr_1fr] auto-rows-fr gap-1 text-center text-sm"></div></div></div>
            <div id="monthly-view" class="view-container hidden"><div class="bg-white/80 backdrop-blur-sm rounded-3xl shadow-lg p-6 border-4 border-teal-200"><div id="monthly-grid-header" class="grid grid-cols-7 gap-2 mb-2"></div><div id="monthly-grid-days" class="grid grid-cols-7 gap-2"></div></div></div>
            <div id="yearly-view" class="view-container hidden relative">
                <div class="absolute -top-4 -left-4 text-4xl animate-pulse">✨</div><div class="absolute -top-2 -right-4 text-4xl animate-bounce" style="animation-delay: 0.5s">🌸</div><div class="absolute -bottom-4 -right-2 text-4xl animate-pulse" style="animation-delay: 0.2s">✨</div><div class="absolute -bottom-2 -left-2 text-4xl animate-bounce">🌸</div>
                <div id="yearly-grid" class="bg-white/80 backdrop-blur-sm rounded-3xl shadow-lg p-6 border-4 border-pink-200 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
            </div>
        </main>
    </div>

    <script>
        // --- 1. ESTADO DE LA APLICACIÓN ---
        let currentDate = new Date();
        let dailyData = {};
        let currentView = 'daily';
        let editingEventId = null; 

        // --- 2. CONSTANTES Y REFERENCIAS AL DOM ---
        const MONTH_NAMES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
        const DAY_NAMES = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
        const HOUR_HEIGHT_PX = 64; 
        const DOM = {
            addEventBtn: document.getElementById('add-event-btn'), 
            dateDisplay: document.getElementById('current-date-display'),
            viewContainers: document.querySelectorAll('.view-container'),
            viewSwitcherBtns: document.querySelectorAll('.view-btn'),
            goalsTextarea: document.getElementById('goals-textarea'),
            notesTextarea: document.getElementById('notes-textarea'),
            taskInput: document.getElementById('task-input'),
            prioritySelect: document.getElementById('priority-select'),
            tasksContainer: document.getElementById('tasks-container'),
            scheduleTimeline: document.getElementById('schedule-timeline'),
            eventStartHour: document.getElementById('event-start-hour'),
            eventStartMinute: document.getElementById('event-start-minute'),
            eventEndHour: document.getElementById('event-end-hour'),
            eventEndMinute: document.getElementById('event-end-minute'),
            eventTextInput: document.getElementById('event-text-input'),
            weeklyGrid: document.getElementById('weekly-grid'),
            monthlyHeader: document.getElementById('monthly-grid-header'),
            monthlyDays: document.getElementById('monthly-grid-days'),
            yearlyGrid: document.getElementById('yearly-grid'),
        };

        // --- 3. FUNCIONES DE DATOS ---
        const formatDateKey = (date) => date.toISOString().split('T')[0];
        const saveData = () => localStorage.setItem('merakelysiPlannerData', JSON.stringify(dailyData));
        const loadData = () => { dailyData = JSON.parse(localStorage.getItem('merakelysiPlannerData')) || {}; };
        const getDayData = (date) => {
            const key = formatDateKey(date);
            if (!dailyData[key]) dailyData[key] = { tasks: [], scheduleEvents: [], notes: '', goals: '' };
            return dailyData[key];
        };

        // --- 4. LÓGICA DE LA APLICACIÓN ---
        const handleAction = (action) => { action(); saveData(); renderApp(); };

        const addTask = () => handleAction(() => {
            const text = DOM.taskInput.value.trim();
            if (text) { getDayData(currentDate).tasks.push({ id: Date.now(), text, completed: false, priority: DOM.prioritySelect.value }); DOM.taskInput.value = ''; }
        });

        const toggleTask = (taskId) => handleAction(() => {
            const task = getDayData(currentDate).tasks.find(t => t.id === taskId);
            if(task) task.completed = !task.completed;
        });

        const deleteTask = (taskId) => handleAction(() => {
            const dayData = getDayData(currentDate);
            dayData.tasks = dayData.tasks.filter(t => t.id !== taskId);
        });

        const addEvent = () => handleAction(() => {
            const startTime = `${DOM.eventStartHour.value}:${DOM.eventStartMinute.value}`;
            const endTime = `${DOM.eventEndHour.value}:${DOM.eventEndMinute.value}`;
            const text = DOM.eventTextInput.value.trim();
            const dayData = getDayData(currentDate);

            if (editingEventId !== null) { 
                const eventIndex = dayData.scheduleEvents.findIndex(e => e.id === editingEventId);
                if (eventIndex > -1) {
                    if (text) { 
                        dayData.scheduleEvents[eventIndex] = { ...dayData.scheduleEvents[eventIndex], startTime, endTime, text };
                    } else { 
                       console.log("Edición cancelada por texto vacío");
                    }
                }
                editingEventId = null; 
            } else if (text) { 
                dayData.scheduleEvents.push({ id: Date.now(), startTime, endTime, text });
            }
            
            dayData.scheduleEvents.sort((a, b) => a.startTime.localeCompare(b.startTime));
            
            DOM.eventTextInput.value = '';
            DOM.addEventBtn.innerHTML = '<i data-lucide="plus"></i>'; 
            // Reset selects to default (optional)
             DOM.eventStartHour.selectedIndex = 0; DOM.eventStartMinute.selectedIndex = 0;
             DOM.eventEndHour.selectedIndex = 0; DOM.eventEndMinute.selectedIndex = 0;
            lucide.createIcons(); 
        });

        const editEvent = (eventId) => {
            const event = getDayData(currentDate).scheduleEvents.find(e => e.id === eventId);
            if (event) {
                const [startH, startM] = event.startTime.split(':');
                const [endH, endM] = event.endTime.split(':');
                DOM.eventStartHour.value = startH;
                DOM.eventStartMinute.value = startM;
                DOM.eventEndHour.value = endH;
                DOM.eventEndMinute.value = endM;
                DOM.eventTextInput.value = event.text;
                editingEventId = eventId; 
                DOM.addEventBtn.innerHTML = '<i data-lucide="save"></i>'; 
                lucide.createIcons(); 
            }
        };

        const deleteEvent = (eventId) => {
            handleAction(() => {
                const dayData = getDayData(currentDate);
                dayData.scheduleEvents = dayData.scheduleEvents.filter(e => e.id !== eventId);
                if (editingEventId === eventId) {
                    editingEventId = null;
                    DOM.eventTextInput.value = '';
                    DOM.addEventBtn.innerHTML = '<i data-lucide="plus"></i>';
                    lucide.createIcons();
                }
            });
        };
        
        const exportToTXT = () => { /* ... (sin cambios) ... */ };
        const exportToICS = () => { /* ... (sin cambios) ... */ };

        // --- 5. RENDERIZADO ---
        const renderDailyView = () => {
            const dayData = getDayData(currentDate);
            DOM.goalsTextarea.value = dayData.goals;
            DOM.notesTextarea.value = dayData.notes;
            DOM.tasksContainer.innerHTML = dayData.tasks.map(task => {
                const colors = { high: 'bg-pink-100 border-pink-300', medium: 'bg-purple-100 border-purple-300', normal: 'bg-blue-100 border-blue-300' };
                return `<div class="p-3 rounded-2xl border-2 flex items-center gap-2 ${colors[task.priority]} ${task.completed ? 'opacity-60' : ''}">
                    <button onclick="toggleTask(${task.id})" class="w-6 h-6 rounded-full border-2 flex items-center justify-center ${task.completed ? 'bg-pink-400 border-pink-400' : 'border-gray-400'}">${task.completed ? '<i data-lucide="check" class="text-white"></i>' : ''}</button>
                    <span class="flex-1 ${task.completed ? 'line-through' : ''}">${task.text}</span>
                    <button onclick="deleteTask(${task.id})" class="text-red-400 hover:text-red-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                </div>`;
            }).join('');
            
            const timeline = DOM.scheduleTimeline;
            timeline.innerHTML = ''; 
            timeline.style.height = `${24 * HOUR_HEIGHT_PX}px`; 

            let backgroundHTML = '';
            for (let hour = 0; hour < 24; hour++) {
                backgroundHTML += `<div class="flex items-start absolute w-full" style="top: ${hour * HOUR_HEIGHT_PX}px; height: ${HOUR_HEIGHT_PX}px;"><div class="w-14 text-xs font-semibold text-gray-400 text-right pr-2 -mt-2">${hour.toString().padStart(2, '0')}:00</div><div class="flex-1 border-t border-pink-200 h-full"></div></div>`;
            }
            timeline.innerHTML = backgroundHTML; 
            
            const minuteHeight = HOUR_HEIGHT_PX / 60; 
            dayData.scheduleEvents.forEach(event => {
                const [startHour, startMinute] = event.startTime.split(':').map(Number);
                const [endHour, endMinute] = event.endTime.split(':').map(Number);
                const top = (startHour * 60 + startMinute) * minuteHeight;
                let durationMinutes = (endHour * 60 + endMinute) - (startHour * 60 + startMinute);
                if (durationMinutes <= 0) { durationMinutes = 15; } 
                const height = Math.max(durationMinutes * minuteHeight, 32); 

                const eventDiv = document.createElement('div');
                eventDiv.className = "absolute left-14 right-0 mx-2 p-2 rounded-lg bg-gradient-to-r from-purple-100 via-pink-100 to-purple-100 border-l-4 border-purple-500 text-purple-800 shadow-lg flex flex-col justify-between overflow-hidden";
                eventDiv.style.top = `${top}px`;
                eventDiv.style.height = `${height}px`;
                eventDiv.style.minHeight = '32px';
                eventDiv.innerHTML = `
                    <div><div class="font-bold text-sm">${event.text}</div><div class="text-xs">${event.startTime} - ${event.endTime}</div></div>
                    <div class="absolute bottom-1 right-1 flex gap-1">
                        <button onclick="editEvent(${event.id})" class="text-purple-600/50 hover:text-purple-700" title="Editar evento"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                        <button onclick="deleteEvent(${event.id})" class="text-red-400/50 hover:text-red-500" title="Borrar evento"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>`;
                timeline.appendChild(eventDiv); 
            });
            DOM.addEventBtn.innerHTML = editingEventId === null ? '<i data-lucide="plus"></i>' : '<i data-lucide="save"></i>';
        };

        const renderWeeklyView = () => {
            let html = `<div class="font-questrial font-bold p-2 text-teal-700">HORA</div>`;
            const weekDays = Array.from({length: 7}, (_, i) => { const d = new Date(currentDate); d.setDate(d.getDate() - d.getDay() + i); return d; });
            weekDays.forEach((day, i) => {
                const eventCount = getDayData(day).scheduleEvents.length;
                const eventIndicator = eventCount > 0 ? `<span class="font-normal text-purple-500">(${eventCount})</span>` : '';
                html += `<div class="font-questrial p-2 rounded-lg border-2 ${day.toDateString() === new Date().toDateString() ? 'bg-pink-300 text-white' : 'bg-pink-100'}">${DAY_NAMES[i]}<br>${day.getDate()} ${eventIndicator}</div>`;
            });
            for (let hour = 0; hour < 24; hour++) {
                html += `<div class="font-semibold p-2 bg-cyan-50 rounded-lg">${hour.toString().padStart(2, '0')}:00</div>`;
                weekDays.forEach(day => {
                    const eventsHTML = getDayData(day).scheduleEvents.filter(e => parseInt(e.startTime.split(':')[0]) === hour).map(e => `<div class="text-xs bg-purple-200 p-1 rounded mb-1 truncate">${e.text}</div>`).join('');
                    html += `<div class="border border-pink-100 min-h-[40px] p-1">${eventsHTML}</div>`;
                });
            }
            DOM.weeklyGrid.innerHTML = html;
        };

        const renderMonthlyView = () => {
            DOM.monthlyHeader.innerHTML = DAY_NAMES.map(day => `<div class="font-questrial font-bold text-center text-teal-700">${day}</div>`).join('');
            const year = currentDate.getFullYear(), month = currentDate.getMonth();
            const firstDay = new Date(year, month, 1), lastDay = new Date(year, month + 1, 0);
            let daysHTML = Array(firstDay.getDay()).fill('<div></div>').join('');
            for (let day = 1; day <= lastDay.getDate(); day++) {
                const date = new Date(year, month, day);
                const isToday = date.toDateString() === new Date().toDateString();
                const dayData = getDayData(date);
                const taskCount = dayData.tasks.length;
                const events = dayData.scheduleEvents;
                const taskIndicator = taskCount > 0 ? `<div class="text-xs text-pink-500 mt-1">🌸 ${taskCount} tareas</div>` : '';
                const eventIndicator = events.slice(0, 2).map(event => `<div class="text-xs bg-purple-200 text-purple-800 p-1 rounded-md truncate mt-1"><span class="font-semibold">${event.startTime}</span> ${event.text}</div>`).join('');
                const bgColor = isToday ? 'bg-pink-300' : 'bg-teal-100/50';
                const borderColor = isToday ? 'border-pink-400' : 'border-teal-200';
                const textColor = isToday ? 'text-white' : 'text-teal-800';
                daysHTML += `<div class="p-2 border-2 rounded-lg min-h-[120px] transition hover:shadow-md hover:border-teal-400 ${bgColor} ${borderColor}"><div class="font-bold ${textColor}">${day}</div><div class="space-y-1">${taskIndicator}${eventIndicator}</div></div>`;
            }
            DOM.monthlyDays.innerHTML = daysHTML;
        };
        
        const renderYearlyView = () => {
            const year = currentDate.getFullYear();
            DOM.yearlyGrid.innerHTML = MONTH_NAMES.map((name, i) => {
                let totalEventsThisMonth = 0;
                const daysInMonth = new Date(year, i + 1, 0).getDate();
                for (let day = 1; day <= daysInMonth; day++) { totalEventsThisMonth += getDayData(new Date(year, i, day)).scheduleEvents.length; }
                const eventIndicator = totalEventsThisMonth > 0 ? `<div class="text-sm text-purple-600 mt-1 flex items-center justify-center gap-1"><i data-lucide="calendar" class="w-4 h-4"></i> ${totalEventsThisMonth} eventos</div>` : '';
                const isCurrentMonth = i === new Date().getMonth() && year === new Date().getFullYear();
                const bgColor = isCurrentMonth ? 'bg-pink-300' : 'bg-cyan-100/70';
                const borderColor = isCurrentMonth ? 'border-pink-400' : 'border-pink-200';
                const textColor = isCurrentMonth ? 'text-white' : 'text-cyan-800';
                return `<div class="h-32 p-4 rounded-2xl border-4 text-center font-bold transition hover:shadow-lg hover:scale-105 flex flex-col justify-center items-center ${bgColor} ${borderColor} ${textColor}">
                    <span class="font-questrial text-2xl">${name}</span>
                    ${eventIndicator}
                </div>`
            }).join('');
        };

        const renderApp = () => {
            if (currentView === 'daily') DOM.dateDisplay.textContent = currentDate.toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            else if (currentView === 'weekly') { const start = new Date(currentDate); start.setDate(start.getDate() - start.getDay()); const end = new Date(start); end.setDate(end.getDate() + 6); DOM.dateDisplay.textContent = `Semana del ${start.getDate()}/${start.getMonth()+1} al ${end.getDate()}/${end.getMonth()+1}`; }
            else if (currentView === 'monthly') DOM.dateDisplay.textContent = `${MONTH_NAMES[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
            else DOM.dateDisplay.textContent = currentDate.getFullYear();
            
            DOM.viewContainers.forEach(c => {
                 c.classList.toggle('hidden', c.id !== `${currentView}-view`);
            });

            DOM.viewSwitcherBtns.forEach(btn => {
                const view = btn.dataset.view;
                const colors = { daily: 'pink', weekly: 'purple', monthly: 'cyan', yearly: 'blue' };
                btn.className = `view-btn px-3 py-2 rounded-xl font-bold transition transform hover:scale-105 ${view === currentView ? `bg-gradient-to-r from-${colors[view]}-400 to-${colors[view]}-500 text-white shadow-lg` : `bg-white text-${colors[view]}-500 hover:bg-${colors[view]}-50`}`;
            });
            const renderers = { daily: renderDailyView, weekly: renderWeeklyView, monthly: renderMonthlyView, yearly: renderYearlyView };
            if (renderers[currentView]) {
                 renderers[currentView]();
            }
            lucide.createIcons();
        };

        // --- 6. INICIALIZACIÓN ---
        document.addEventListener('DOMContentLoaded', () => {
            const populateTimeSelects = () => {
                // Limpiar selectores antes de poblar (importante si se llama más de una vez)
                DOM.eventStartHour.innerHTML = ''; DOM.eventEndHour.innerHTML = '';
                DOM.eventStartMinute.innerHTML = ''; DOM.eventEndMinute.innerHTML = '';
                
                for (let i = 0; i < 24; i++) {
                    const hour = i.toString().padStart(2, '0');
                    DOM.eventStartHour.innerHTML += `<option value="${hour}">${hour}</option>`;
                    DOM.eventEndHour.innerHTML += `<option value="${hour}">${hour}</option>`;
                }
                ['00', '30'].forEach(minute => {
                    DOM.eventStartMinute.innerHTML += `<option value="${minute}">${minute}</option>`;
                    DOM.eventEndMinute.innerHTML += `<option value="${minute}">${minute}</option>`;
                });
            };
            populateTimeSelects();

            const handleNav = (dir) => {
                // Salir del modo edición si cambiamos de día/semana/mes/año
                 if (editingEventId !== null) {
                    editingEventId = null;
                    DOM.eventTextInput.value = '';
                    DOM.addEventBtn.innerHTML = '<i data-lucide="plus"></i>'; 
                    lucide.createIcons();
                }
                if (currentView === 'daily') currentDate.setDate(currentDate.getDate() + dir);
                else if (currentView === 'weekly') currentDate.setDate(currentDate.getDate() + 7 * dir);
                else if (currentView === 'monthly') currentDate.setMonth(currentDate.getMonth() + dir);
                else currentDate.setFullYear(currentDate.getFullYear() + dir);
                renderApp();
            };
            document.getElementById('prev-btn').addEventListener('click', () => handleNav(-1));
            document.getElementById('next-btn').addEventListener('click', () => handleNav(1));
            document.getElementById('add-task-btn').addEventListener('click', addTask);
            document.getElementById('add-event-btn').addEventListener('click', addEvent); 
            document.getElementById('export-txt-btn').addEventListener('click', exportToTXT);
            document.getElementById('export-ics-btn').addEventListener('click', exportToICS);
            DOM.viewSwitcherBtns.forEach(btn => btn.addEventListener('click', () => { 
                if (editingEventId !== null) {
                    editingEventId = null;
                    DOM.eventTextInput.value = '';
                    DOM.addEventBtn.innerHTML = '<i data-lucide="plus"></i>'; 
                    lucide.createIcons();
                }
                currentView = btn.dataset.view; 
                renderApp(); 
            }));
            DOM.goalsTextarea.addEventListener('input', (e) => { getDayData(currentDate).goals = e.target.value; saveData(); });
            DOM.notesTextarea.addEventListener('input', (e) => { getDayData(currentDate).notes = e.target.value; saveData(); });
            DOM.taskInput.addEventListener('keypress', (e) => e.key === 'Enter' && addTask());
            DOM.eventTextInput.addEventListener('keypress', (e) => e.key === 'Enter' && addEvent());
            loadData();
            renderApp();
        });
    </script>
</body>
</html>
